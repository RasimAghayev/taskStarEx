#version: "3.9"

name: "teststarex"
networks:
  teststarex:
    name: teststarex

services:
  nginx:
    build:
      context: .
      dockerfile: nginx.dockerfile
    container_name: nginx
    depends_on:
      - php
      - pgsql
    ports:
      - "80:80"
    volumes:
      - ./src/be:/var/www/html/be:delegated
    networks:
      - teststarex

  php:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: php
    volumes:
      - ./src/be:/var/www/html/be:delegated
    networks:
      - teststarex

  composer:
    image: composer:latest
    container_name: composer
    volumes:
      - ./src/be:/var/www/html/be
    working_dir: /var/www/html/be
    networks:
      - teststarex

  artisan:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: artisan
    volumes:
      - ./src/be:/var/www/html/be
    working_dir: /var/www/html/be
    entrypoint: ["php", "artisan"]
    networks:
      - teststarex

  phpunit:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: phpunit
    volumes:
      - ./src/be:/var/www/html/be
    working_dir: /var/www/html/be
    entrypoint: ["/var/www/html/be/vendor/bin/phpunit"]
    networks:
      - teststarex

  pgsql:
    image: postgres:latest
    container_name: pgsql
    restart: always
    shm_size: 128mb
    ports:
      - "6432:5432"
    volumes:
      - ./db/postgres:/var/lib/postgresql/data
    networks:
      - teststarex
    environment:
      - POSTGRES_DB=laraveldb
      - POSTGRES_USER=laravel
      - POSTGRES_PASSWORD=***REMOVED***

  fe:
    build:
      context: .
      dockerfile: node.dockerfile
    container_name: fe
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_URL=http://localhost/api
    networks:
      - teststarex

  npm:
    image: node:current-alpine
    container_name: npm
    ports:
      - "5173:3000"
    volumes:
      - ./src/fe:/var/www/html/fe
    working_dir: /var/www/html/fe
    entrypoint: ["npm"]
    networks:
      - teststarex

  npx:
    image: node:current-alpine
    container_name: npx
    volumes:
      - ./src/fe:/var/www/html/fe
    working_dir: /var/www/html/fe
    entrypoint: ["npx"]
    networks:
      - teststarex
