name: "teststarex"

networks:
  teststarex:
    name: teststarex

volumes:
  pgsql_data:
  be_storage:

services:
  # --- core services (standalone, image-baked code, no manual steps) -------
  nginx:
    build:
      context: .
      dockerfile: nginx.dockerfile
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${APP_PORT:-20250}:80"
    networks:
      - teststarex
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: php.dockerfile
      target: runtime
    env_file:
      - ./src/be/.env
    depends_on:
      pgsql:
        condition: service_healthy
    volumes:
      - be_storage:/var/www/html/be/storage
    networks:
      - teststarex
    restart: unless-stopped

  pgsql:
    image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    restart: unless-stopped
    shm_size: 128mb
    ports:
      - "${POSTGRES_PORT:-20252}:5432"
    volumes:
      # Postgres 18+ images store data in a version-specific subdirectory and
      # expect a single mount at /var/lib/postgresql (NOT .../data as in older
      # postgres images / this repo's pre-Phase-5 compose file) — verified
      # empirically in this phase, see docs/BASELINE.md.
      - pgsql_data:/var/lib/postgresql
    networks:
      - teststarex
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (see .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laravel} -d ${POSTGRES_DB:-laraveldb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fe:
    build:
      context: .
      dockerfile: node.dockerfile
      target: runtime
    ports:
      - "${FE_PORT:-20251}:3000"
    environment:
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:20250/api}
    networks:
      - teststarex
    restart: unless-stopped

  # --- dev-only tool runners (not started by `docker compose up`) ----------
  # Usage: docker compose --profile tools run --rm php-dev php artisan migrate
  #        docker compose --profile tools run --rm php-dev composer require ...
  #        docker compose --profile tools run --rm php-dev ./vendor/bin/pint
  php-dev:
    build:
      context: .
      dockerfile: php.dockerfile
      target: build
    profiles: ["tools"]
    env_file:
      - ./src/be/.env
    depends_on:
      pgsql:
        condition: service_healthy
    volumes:
      - be_storage:/var/www/html/be/storage
    networks:
      - teststarex

  # Usage: docker compose --profile tools run --rm fe-dev npm run dev
  #        docker compose --profile tools run --rm fe-dev npx nuxi@latest ...
  fe-dev:
    build:
      context: .
      dockerfile: node.dockerfile
      target: build
    profiles: ["tools"]
    networks:
      - teststarex
