<VirtualHost *:80>
    ServerAdmin webmaster@teststarex.com
    DocumentRoot /var/www/html/be
    ServerName localhost
    ServerAlias localhost
    ErrorLog "logs/localhost-error_log"
    CustomLog "logs/localhost-access_log" common

    <Directory /var/www/html/be >
        Options Includes FollowSymLinks
        # DirectoryIndex index.php index.html
        AllowOverride All
        Order allow,deny
        Allow from all
        Require all granted
    </Directory>
</VirtualHost>